<!DOCTYPE html>
<html lang="en" data-theme="drift">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pole Position — Job Hunt</title>
<meta name="description" content="Benjamin's drift-spec job-hunt cockpit." />
<meta name="theme-color" content="#0e0f13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pole Position" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
:root{
  --bg:#0e0f13; --panel:#15171f; --panel2:#1c1f29; --raised:#232734;
  --ink:#eceefb; --muted:#8b90a4; --line:rgba(255,255,255,.08);
  --accent:#1fe0c8; --accent2:#ff2d95;
  --warn:#ffb02e; --good:#23c9a0; --bad:#ff5a6e;
  --grad:radial-gradient(120% 80% at 80% -10%, rgba(255,45,149,.16), transparent 60%),
         radial-gradient(120% 90% at -10% 10%, rgba(31,224,200,.14), transparent 55%);
}
html[data-theme="porsche"]{ --accent:#d5001c; --accent2:#caa46a; --grad:radial-gradient(120% 80% at 80% -10%, rgba(213,0,28,.18), transparent 60%); }
html[data-theme="amg"]{ --accent:#00d2a0; --accent2:#c9ccd4; --grad:radial-gradient(120% 80% at 80% -10%, rgba(0,210,160,.16), transparent 60%); }
html[data-theme="mblue"]{ --accent:#16a0ff; --accent2:#e2002b; --grad:radial-gradient(120% 80% at 50% -10%, rgba(22,160,255,.18), transparent 60%); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--grad);background-attachment:fixed;color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
.mono{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:76px;resize:vertical}
label.fld{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
header.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:9px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:linear-gradient(180deg, rgba(14,15,19,.96), rgba(14,15,19,.78));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.04em}
.brand .flag{width:18px;height:18px;border-radius:4px;background:conic-gradient(#fff 0 25%, #111 0 50%, #fff 0 75%, #111 0) 0 0/9px 9px;box-shadow:0 0 0 1px var(--line)}
.brand .nm{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.bar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px}
.iconbtn:active{transform:translateY(1px)}
#connDot{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px;color:var(--muted)}
#connDot.on{color:var(--good);border-color:rgba(35,201,160,.5);box-shadow:0 0 10px rgba(35,201,160,.35)}
#connDot.flash{animation:flash .8s ease}
@keyframes flash{0%,100%{box-shadow:0 0 10px rgba(35,201,160,.35)}50%{box-shadow:0 0 18px rgba(31,224,200,.9)}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);
  background:linear-gradient(0deg, rgba(14,15,19,.98), rgba(14,15,19,.85));backdrop-filter:blur(10px);border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:5px 8px;border-radius:12px;min-width:56px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel)}
nav.tabs button[aria-selected="true"] .ic{filter:drop-shadow(0 0 8px var(--accent))}
main{max-width:1180px;margin:0 auto;padding:14px 14px 92px}
.view{display:none}.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
h2.sec{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 4px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.pill{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.help{border-color:rgba(31,224,200,.45);color:var(--accent)}
.chkrow{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.chkrow:last-child{border-bottom:0}.chkrow input{width:auto;flex:0 0 auto;margin:0}
.helpbox{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:2px 11px;margin-top:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-weight:600}
.btn.go{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06121a;border:0}
.btn.danger{border-color:rgba(255,90,110,.5);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.muted{color:var(--muted)} .tiny{font-size:12px}
.flagstar{color:var(--warn)}
.cockpit{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;align-items:center}
@media(max-width:520px){.cockpit{grid-template-columns:120px minmax(0,1fr)}}
.tacho{position:relative;width:100%;aspect-ratio:1;max-width:170px;margin:auto}
.tacho .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tacho .big{font-size:30px;font-weight:800;line-height:1}
.tacho .sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
.statchips{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:9px 12px;flex:1 1 90px;min-width:80px}
.stat b{display:block;font-size:21px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.fire{color:var(--warn)}
.action{display:flex;gap:11px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:9px;flex-wrap:wrap}
.action .ttl{overflow-wrap:anywhere}
.action.over{border-color:rgba(255,90,110,.5)}
.action .check{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.action .check:active{transform:scale(.92)}
.action .meta{flex:1;min-width:0}
.action .ttl{font-weight:600}
.action .from{font-size:12px;color:var(--muted);margin-top:1px}
.due{font-size:11px;padding:2px 8px;border-radius:999px}
.due.today{background:rgba(31,224,200,.16);color:var(--accent)}
.due.over{background:rgba(255,90,110,.16);color:var(--bad)}
.due.soon{background:rgba(255,176,46,.14);color:var(--warn)}
.board{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x proximity}
.col{flex:0 0 270px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-height:120px}
.col.drag{outline:2px dashed var(--accent);outline-offset:-4px}
.col h3{display:flex;align-items:center;gap:8px;font-size:13px;margin:2px 2px 4px}
.col h3 .dot{width:9px;height:9px;border-radius:50%}
.col h3 .ct{margin-left:auto;font-size:11px;color:var(--muted)}
.col .tip{font-size:11px;color:var(--muted);margin:0 2px 9px;line-height:1.35}
.lead{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:12px;padding:10px;margin-bottom:9px;cursor:grab}
.lead:active{cursor:grabbing}.lead.fav{box-shadow:inset 0 0 0 1px rgba(255,176,46,.35)}
.lead .co{font-weight:700;display:flex;align-items:center;gap:6px}
.lead .ro{font-size:12.5px;color:var(--muted);margin-top:1px}
.lead .lr{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lead .stg{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
.lead select.mv{font-size:11px;padding:4px 6px;border-radius:8px;width:auto;flex:1}
.item{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--panel);margin-bottom:8px}
.item.done{opacity:.5}.item.done .it-ttl{text-decoration:line-through}
.item .it-ttl{font-weight:600}.item .it-sub{font-size:12px;color:var(--muted)}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .chev{color:var(--muted);font-size:18px}
.catpill{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(4,5,8,.6);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
@media(min-width:680px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{margin:2px 0 2px;font-size:18px}
.sheet .x{position:sticky;top:0;float:right;font-size:20px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.debrief{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:var(--panel2)}
.guide-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.guide-tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 13px}
.guide-tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--accent)}
.gbody h4{margin:16px 0 4px}.gbody li{margin:4px 0}
.salbar{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0}
.salbar .b{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--accent),transparent);position:relative}
.salbar .b span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:11px}
.salbar .b small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.banner{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:40;background:var(--raised);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.banner.on{display:flex}
.qrwrap{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:8px auto}
.note{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.note b{display:block;margin-bottom:2px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:25;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121a;font-size:26px;font-weight:700;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
/* install overlay */
.install{position:fixed;inset:0;z-index:60;background:rgba(4,5,8,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
.install.on{display:flex}
.install .card{max-width:420px;text-align:center}
.install .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 10px;display:block}
.install h3{font-size:20px;margin:6px 0}
.install .steps{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.install .share{display:inline-block;border:1px solid var(--accent);border-radius:8px;padding:1px 7px;color:var(--accent)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><span class="flag"></span><span>POLE <span class="nm">POSITION</span></span></div>
  <span class="ver mono" id="verChip">v0.0.0</span>
  <span class="spacer"></span>
  <button id="connDot" title="">●</button>
  <button class="iconbtn" id="syncBtn" title="Sync">⇄</button>
  <button class="iconbtn" id="menuBtn" title="Menu">⋯</button>
</header>

<main>
  <section class="view" data-view="focus" id="view-focus">
    <div class="card">
      <div class="cockpit">
        <div class="tacho" id="tacho"></div>
        <div>
          <div style="font-weight:800;font-size:18px" id="greet"></div>
          <div class="muted tiny" id="todayStr" style="margin-bottom:10px"></div>
          <div class="statchips">
            <div class="stat"><b id="stXp">0</b><span id="stXpSub"></span></div>
            <div class="stat"><b class="fire" id="stStreak">0🔥</b><span id="stStreakSub"></span></div>
            <div class="stat"><b id="stOpen">0</b><span id="stOpenSub"></span></div>
          </div>
        </div>
      </div>
    </div>
    <h2 class="sec" id="h-focus-next"></h2>
    <div id="nextList"></div>
  </section>

  <section class="view" data-view="board" id="view-board">
    <h2 class="sec" id="h-board"></h2>
    <div class="board" id="board"></div>
  </section>

  <section class="view" data-view="tasks" id="view-tasks">
    <h2 class="sec" id="h-tasks"></h2>
    <div id="taskList"></div>
  </section>

  <section class="view" data-view="network" id="view-network">
    <h2 class="sec" id="h-net"></h2>
    <p class="muted tiny" id="h-net-sub" style="margin:0 4px 10px"></p>
    <div id="contactList"></div>
  </section>

  <section class="view" data-view="guide" id="view-guide">
    <h2 class="sec" id="h-guide"></h2>
    <div class="card">
      <div class="guide-tabs" id="guideTabs"></div>
      <div class="gbody" id="guideBody"></div>
    </div>
  </section>
</main>

<button class="fab" id="fab" title="Add">+</button>

<nav class="tabs" id="tabs">
  <button data-go="focus" aria-selected="true"><span class="ic">🏁</span><span class="lab"></span></button>
  <button data-go="board"><span class="ic">📋</span><span class="lab"></span></button>
  <button data-go="tasks"><span class="ic">✓</span><span class="lab"></span></button>
  <button data-go="network"><span class="ic">🤝</span><span class="lab"></span></button>
  <button data-go="guide"><span class="ic">💡</span><span class="lab"></span></button>
</nav>

<div class="banner" id="updBanner"><span id="updMsg"></span><button class="btn sm go" id="updBtn" style="margin-left:auto"></button></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="install" id="installScrim"><div class="card" id="installCard"></div></div>

<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="vendor/jsqr.min.js"></script>
<script src="src/sync.js"></script>
<script src="src/i18n.js"></script>
<script>
"use strict";
const APP_VERSION = "1.4.0";
const KEY = "pole_position_v1";
const S = window.PP_SYNC, I = window.PP_I18N;
const t = (k,v)=>I.t(k,v);
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

const STAGE_KEYS = ['researching','resume','cover','applied','contacted','interviewing','offer','closed'];
const STAGE_COLORS = {researching:'#8b90a4',resume:'#5b8def',cover:'#7c6cff',applied:'#1fe0c8',contacted:'#23c9a0',interviewing:'#ffb02e',offer:'#ff2d95',closed:'#4a4f5e'};
const CAT_KEYS = ['setup','admin','skill','network','other'];
const XP = {task:10, advance:15, debrief:20, lead:5};

let state = load();
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){} return seed(); }
function migrate(s){ s.settings=s.settings||{}; if(!s.settings.lang) s.settings.lang='en'; s.debriefs=s.debriefs||[]; s.contacts=s.contacts||[]; s.tasks=s.tasks||[]; (s.contacts||[]).forEach(c=>{ if(!Array.isArray(c.helpsWith)) c.helpsWith=[]; }); return s; }
function helpersForLead(id){ return S.live(state.contacts).filter(c=>(c.helpsWith||[]).includes(id)); }
function helpCount(c){ return (c.helpsWith||[]).filter(id=>state.leads.some(l=>l.id===id&&!l.deleted)).length; }
function save(){ state.settings.updatedAt=S.nowISO(); localStorage.setItem(KEY, JSON.stringify(state)); if(!_applyingRemote) broadcast(); }
function touch(r){ r.updatedAt=S.nowISO(); return r; }

function seed(){
  // STABLE deterministic ids: identical on every device, so a first-time sync merges
  // the seed instead of duplicating it (the v1.2.0 duplicate bug). Never use S.uid() here.
  const t0=S.nowISO(); const mk=(id,o)=>Object.assign({id,updatedAt:t0,deleted:false},o);
  const porsche=mk('seed-lead-porsche',{company:'Porsche Zentrum Schlieren',role:'Automobilmechatroniker / Service technician',link:'https://www.porsche.com/swiss/de/aboutporsche/jobs/',location:'Schlieren, ZH',salary:"CHF 5'300–5'800 / mo (target)",source:'Porsche careers',favourite:true,priority:5,stage:'researching',nextAction:'Tailor dossier to Porsche (highlight HV cert.)',nextDue:isoIn(5),contacts:[],notes:'Dream employer, right on the doorstep. AMG + HV are the levers.'});
  const amg=mk('seed-lead-amg',{company:'Mercedes-AMG',role:'High-performance mechatronics / AMG',link:'',location:'CH / DE',salary:'',source:'Network',favourite:true,priority:4,stage:'researching',nextAction:'Ask Merbag colleagues for AMG contacts',nextDue:isoIn(6),contacts:[],notes:'Plays directly to your SLS/G63/E63/C63 experience.'});
  const kessel=mk('seed-lead-kessel',{company:'Kessel AG — Ferrari / Maserati',role:'Sports-car mechatronics',link:'',location:'Volketswil, ZH',salary:'',source:'jobs.ch',favourite:false,priority:3,stage:'researching',nextAction:'Check open positions',nextDue:'',contacts:[],notes:'Sports-car segment.'});
  return {
    leads:[porsche,amg,kessel],
    tasks:[
      mk('seed-task-cv',{title:'Finalise CV (DE + EN)',category:'setup',due:isoIn(4),priority:'high',done:false,recurring:false,notes:'Use the Porsche version as the base. Keep AGVS + Mercedes HV/EV cert at the top.'}),
      mk('seed-task-ref',{title:'Ask Merbag team lead for a reference letter',category:'network',due:isoIn(6),priority:'high',done:false,notes:''}),
      mk('seed-task-linkedin',{title:'Set up LinkedIn profile (HV/EV visible)',category:'setup',due:isoIn(8),priority:'med',done:false,notes:''}),
      mk('seed-task-hv',{title:'Collect HV certificates as PDF',category:'admin',due:isoIn(3),priority:'med',done:false,notes:''}),
    ],
    contacts:[ mk('seed-contact-merbag',{name:'Merbag team lead',company:'Merbag AG',relationship:'Trainer / reference',intro:'Direct',notes:'Strongest reference — largest MB workshop in CH.',helpsWith:['seed-lead-amg']}) ],
    debriefs:[],
    settings:{theme:'drift',dailyGoal:3,name:'Ben',lang:'en',knownDevices:[],updatedAt:t0},
    meta:{xp:0,streak:0,bestStreak:0,lastActiveDay:''},
  };
}
function cleanupDuplicates(){
  const norm=s=>String(s||'').trim().toLowerCase(); let total=0;
  const a=S.dedupeByKey(state.leads, l=>l.company?norm(l.company)+'|'+norm(l.role):null); state.leads=a.result; total+=a.removed;
  const b=S.dedupeByKey(state.tasks, x=>norm(x.title)||null); state.tasks=b.result; total+=b.removed;
  const c=S.dedupeByKey(state.contacts, x=>x.name?norm(x.name)+'|'+norm(x.company):null); state.contacts=c.result; total+=c.removed;
  if(total) save();
  return total;
}
function isoIn(d){ const x=new Date(); x.setDate(x.getDate()+d); return x.toISOString().slice(0,10); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function stageColor(k){ return STAGE_COLORS[k]||STAGE_COLORS.researching; }

function levelFor(xp){ return Math.floor(Math.sqrt(xp/40))+1; }
function award(kind){
  state.meta.xp += (XP[kind]||0);
  const tk=todayKey();
  if(state.meta.lastActiveDay!==tk){
    const y=new Date(); y.setDate(y.getDate()-1);
    state.meta.streak = (state.meta.lastActiveDay===y.toISOString().slice(0,10)) ? state.meta.streak+1 : 1;
    state.meta.lastActiveDay=tk; state.meta.bestStreak=Math.max(state.meta.bestStreak,state.meta.streak);
  }
}

function tacho(done,goal){
  const frac=Math.max(0,Math.min(1,goal?done/goal:0));
  const a0=-220,a1=40,ang=a0+(a1-a0)*frac;
  const ticks=Array.from({length:9},(_,i)=>{const a=(a0+(a1-a0)*(i/8))*Math.PI/180,r1=44,r2=49,cx=50,cy=50,hot=i/8>0.72;
    return `<line x1="${cx+r1*Math.cos(a)}" y1="${cy+r1*Math.sin(a)}" x2="${cx+r2*Math.cos(a)}" y2="${cy+r2*Math.sin(a)}" stroke="${hot?'var(--accent2)':'var(--muted)'}" stroke-width="1.5"/>`;}).join('');
  const ar=ang*Math.PI/180,nx=50+34*Math.cos(ar),ny=50+34*Math.sin(ar);
  return `<svg viewBox="0 0 100 100" width="100%" height="100%">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
    <path d="M ${50+44*Math.cos(a0*Math.PI/180)} ${50+44*Math.sin(a0*Math.PI/180)} A 44 44 0 1 1 ${50+44*Math.cos(a1*Math.PI/180)} ${50+44*Math.sin(a1*Math.PI/180)}" fill="none" stroke="var(--line)" stroke-width="6"/>
    <path d="M ${50+44*Math.cos(a0*Math.PI/180)} ${50+44*Math.sin(a0*Math.PI/180)} A 44 44 0 ${frac>0.62?1:0} 1 ${50+44*Math.cos(ar)} ${50+44*Math.sin(ar)}" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>
    ${ticks}<line x1="50" y1="50" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="var(--ink)"/></svg>
    <div class="lab"><div class="big mono">${done}/${goal}</div><div class="sub">${t('focus.tacho_sub')}</div></div>`;
}

function dueInfo(due){ if(!due) return {cls:'',txt:''};
  const days=Math.round((new Date(due)-new Date(todayKey()))/864e5);

  return {cls:'',txt:new Date(due).toLocaleDateString(I.getLang()==='de'?'de-CH':'en-GB',{day:'numeric',month:'short'})};
}

    <input type="file" id="m_file" accept="application/json" style="display:none">
    <button class="btn" id="m_update" style="width:100%;margin-top:12px">${t('menu.check_updates')}</button>
    <p class="muted tiny" style="margin-top:12px">${t('menu.footer',{v:APP_VERSION})}</p>`);
  $('#m_lang').onchange=e=>{ state.settings.lang=e.target.value; I.setLang(state.settings.lang); save(); render(); openMenu(); };
  $('#m_theme').onchange=e=>{ state.settings.theme=e.target.value; save(); render(); };
  $('#m_goal').onchange=e=>{ state.settings.dailyGoal=+e.target.value||3; save(); renderFocus(); };
  $('#m_export').onclick=exportJSON; $('#m_import').onclick=()=>$('#m_file').click(); $('#m_file').onchange=importFile;
  $('#m_sync').onclick=openSync;
  $('#m_cleanup').onclick=()=>{ if(!confirm(t('confirm.cleanup'))) return; const n=cleanupDuplicates(); render(); toast(n?t('toast.cleaned',{n}):t('toast.cleaned_none')); };
  $('#m_update').onclick=()=>checkForUpdates(true);
  if($('#m_install')) $('#m_install').onclick=()=>{ closeSheet(); showInstall(true); };
}
function exportJSON(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`pole-position-${todayKey()}.json`; a.click(); URL.revokeObjectURL(a.href); toast(t('toast.exported')); }
function importFile(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ ingest(JSON.parse(r.result)); }catch(err){ toast(t('toast.bad_file')); } }; r.readAsText(f); }
function ingest(data){
  if(data && (data._format||'').startsWith('pole-position-import')){ let n=0; const ts=S.nowISO();
    (data.leads||[]).forEach(o=>{ state.leads.push(Object.assign({id:S.uid(),updatedAt:ts,deleted:false,stage:'researching',priority:3,favourite:false,contacts:[]},o)); n++; });
    (data.tasks||[]).forEach(o=>{ state.tasks.push(Object.assign({id:S.uid(),updatedAt:ts,deleted:false,done:false,priority:'med',category:'other'},o)); n++; });
    save(); render(); closeSheet(); toast(t('toast.imported',{n})); return; }
  state=S.mergeState(state,data); save(); render(); closeSheet(); toast(t('toast.merged'));
}

/* ---------- multi-device live sync (PeerJS) ---------- */
// Each device has a STABLE deviceId (its PeerJS id), a friendly name, and a remembered
// list of paired devices (all device-local — never synced). Multiple simultaneous
// connections are supported (e.g. phone ↔ two laptops); a change is broadcast to all
// peers, and a received change that alters local state is gossiped onward so a hub
// topology converges. Merge is LWW + tombstones (settings excluded → stay per-device).
let peer=null, conns={}, _applyingRemote=false, _peerStarting=false;
function deviceLabelFromUA(){
  const ua=navigator.userAgent;
  const plat=/iphone/i.test(ua)?'iPhone':/ipad/i.test(ua)?'iPad':/android/i.test(ua)?'Android':/(macintosh|mac os)/i.test(ua)?'Mac':/windows/i.test(ua)?'Windows PC':/linux/i.test(ua)?'Linux':'Device';
  const br=/edg/i.test(ua)?'Edge':/(chrome|crios)/i.test(ua)?'Chrome':/firefox|fxios/i.test(ua)?'Firefox':/safari/i.test(ua)?'Safari':'';
  return (state.settings.name||'Ben')+"'s "+plat+(br?` (${br})`:'');
}
function syncPayload(){ return {leads:state.leads,tasks:state.tasks,contacts:state.contacts,debriefs:state.debriefs,meta:state.meta}; }
function snapHash(){ const s=JSON.stringify(syncPayload()); let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return h; }
function openConns(){ return Object.values(conns).filter(c=>c&&c.open); }
function connectedNames(){ const k=state.settings.knownDevices||[]; return openConns().map(c=>(k.find(d=>d.id===c.peer)||{}).name||c.peer); }
function updateConnUI(){ const d=$('#connDot'); const n=openConns().length; if(n){ d.classList.add('on'); d.title=t('conn.connected_n',{n})+' — '+connectedNames().join(', '); } else { d.classList.remove('on'); d.title=t('conn.disconnected'); } if($('#deviceList')) renderDeviceList(); }
function flashSynced(){ const d=$('#connDot'); d.classList.add('flash'); setTimeout(()=>d.classList.remove('flash'),800); }
function broadcast(){ const p=syncPayload(); openConns().forEach(c=>{ try{ c.send({type:'state', payload:p}); }catch(e){} }); }
function forwardExcept(exceptId){ const p=syncPayload(); openConns().forEach(c=>{ if(c.peer!==exceptId){ try{ c.send({type:'state', payload:p}); }catch(e){} } }); }
function rememberDevice(id,name){ const k=state.settings.knownDevices=state.settings.knownDevices||[]; const ex=k.find(d=>d.id===id); if(ex){ if(name) ex.name=name; ex.lastSeen=S.nowISO(); } else { k.push({id,name:name||id,lastSeen:S.nowISO()}); } save(); }
function startPeer(cb){
  if(peer && !peer.destroyed){ if(peer.open) cb&&cb(); return; }
  if(_peerStarting){ return; } _peerStarting=true;
  try{ peer=new Peer(state.settings.deviceId); }catch(e){ _peerStarting=false; return; }
  peer.on('open',()=>{ _peerStarting=false; (state.settings.knownDevices||[]).forEach(d=>connectTo(d.id)); updateConnUI(); cb&&cb(); });
  peer.on('connection',c=>wireConn(c));
  peer.on('disconnected',()=>{ try{ peer.reconnect(); }catch(e){} });
  peer.on('error',e=>{ _peerStarting=false; if(e&&e.type==='unavailable-id'){ setTimeout(()=>{ try{peer.destroy();}catch(_){} peer=null; startPeer(cb); },4000); } });
}
function connectTo(id){ if(!id||id===state.settings.deviceId) return; if(conns[id]&&conns[id].open) return; try{ const c=peer&&peer.connect(id,{reliable:true}); if(c) wireConn(c); }catch(e){} }
function wireConn(c){
  c.on('open',()=>{ conns[c.peer]=c; try{ c.send({type:'hello', id:state.settings.deviceId, name:state.settings.deviceName, payload:syncPayload()}); }catch(e){} updateConnUI(); });
  c.on('data',d=>{
    if(!d) return;
    if(d.type==='hello'||d.type==='state'){
      if(d.id){ rememberDevice(d.id, d.name); conns[d.id]=c; }
      if(d.payload){ const before=snapHash(); _applyingRemote=true; state=S.mergeState(state,d.payload); save(); _applyingRemote=false; render(); if(snapHash()!==before) forwardExcept(c.peer); }
      updateConnUI(); flashSynced();
      if(d.type==='hello' && d.name) toast(t('toast.connected_to',{name:d.name}));
    }
  });
  c.on('close',()=>{ delete conns[c.peer]; updateConnUI(); });
  c.on('error',()=>{ delete conns[c.peer]; updateConnUI(); });
}
function disconnectDevice(id){ const c=conns[id]; if(c){ try{c.close();}catch(e){} } delete conns[id]; updateConnUI(); }
function forgetDevice(id){ disconnectDevice(id); state.settings.knownDevices=(state.settings.knownDevices||[]).filter(d=>d.id!==id); save(); if($('#deviceList')) renderDeviceList(); toast(t('toast.device_forgotten')); }
function addDevice(code){ code=(code||'').trim(); if(!code) return toast(t('sync.code_missing')); if(code===state.settings.deviceId) return toast(t('sync.code_self'));
  startPeer(()=>{ rememberDevice(code, code); connectTo(code); toast(t('toast.device_added')); setTimeout(()=>{ if($('#deviceList')) renderDeviceList(); },300); }); }
function renderDeviceList(){
  const el=$('#deviceList'); if(!el) return; const k=state.settings.knownDevices||[];
  if(!k.length){ el.innerHTML=`<p class="muted tiny">${t('sync.none_known')}</p>`; return; }
  el.innerHTML=k.map(d=>{ const on=conns[d.id]&&conns[d.id].open;
    return `<div class="item"><div class="body"><div class="it-ttl">${esc(d.name)}</div>
      <div class="it-sub"><span style="color:${on?'var(--good)':'var(--muted)'}">● ${on?t('sync.online'):t('sync.offline')}</span></div></div>
      <button class="btn sm" data-forget="${esc(d.id)}">${t('sync.forget')}</button></div>`;}).join('');
  $$('[data-forget]',el).forEach(b=>b.onclick=()=>{ if(confirm(t('confirm.forget'))) forgetDevice(b.dataset.forget); });
}
function openSync(){
  startPeer();
  openSheet(`<h3>${t('sync.title')}</h3>
    <div class="note"><b>${t('sync.where_h')}</b><span class="tiny muted">${t('sync.where_b')}</span></div>
    <div class="card"><b>${t('sync.this_device')}</b>
      <div class="row" style="gap:8px;margin-top:6px"><input id="s_dname" value="${attr(state.settings.deviceName)}" style="flex:1">
        <button class="btn sm" id="s_rename">${t('sync.save')}</button></div>
      <p class="tiny muted" style="margin:8px 0 2px">${t('sync.your_code')}</p>
      <div class="mono" style="font-size:15px;text-align:center;word-break:break-all">${esc(state.settings.deviceId)}</div>
      <div class="qrwrap" id="qr"></div></div>
    <div class="card" style="margin-top:10px"><b>${t('sync.add_device')}</b><p class="tiny muted">${t('sync.add_hint')}</p>
      <input id="s_code" placeholder="${t('sync.code_ph')}"><button class="btn go" id="s_add" style="width:100%;margin-top:8px">${t('sync.add_btn')}</button></div>
    <h3 style="font-size:15px;margin:14px 0 4px">${t('sync.known')}</h3><div id="deviceList"></div>
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn" id="s_export" style="flex:1">${t('sync.export_file')}</button>
      <button class="btn" id="s_import" style="flex:1">${t('sync.import_file')}</button><input type="file" id="s_file" accept="application/json" style="display:none"></div>`);
  try{ new QRCode($('#qr'),{text:state.settings.deviceId,width:140,height:140,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  $('#s_rename').onclick=()=>{ const v=$('#s_dname').value.trim(); if(v){ state.settings.deviceName=v; save(); toast(t('toast.saved')); updateConnUI(); } };
  $('#s_add').onclick=()=>{ addDevice($('#s_code').value); $('#s_code').value=''; };
  $('#s_export').onclick=exportJSON; $('#s_import').onclick=()=>$('#s_file').click(); $('#s_file').onchange=importFile;
  renderDeviceList();
}

/* ---------- install overlay ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; });
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function showInstall(force){
  if(isStandalone()) return;
  if(!force && localStorage.getItem('pp_install_dismissed_v1')) return;
  const ios=isIOS();
  $('#installCard').innerHTML=`<img class="logo" src="icons/icon-192.png" alt="">
    <h3>${t('install.title')}</h3><p class="muted">${t('install.why')}</p>
    <div class="steps">${ios?`${t('install.ios').replace('↑','<span class="share">↑</span>')}`:t('install.desktop')}</div>
    <div class="row" style="gap:8px">${ios?'':`<button class="btn go" id="i_install" style="flex:1">${t('install.install_btn')}</button>`}
      <button class="btn" id="i_later" style="flex:1">${t('install.later')}</button></div>`;
  $('#installScrim').classList.add('on');
  $('#i_later').onclick=()=>{ localStorage.setItem('pp_install_dismissed_v1','1'); $('#installScrim').classList.remove('on'); };
  if($('#i_install')) $('#i_install').onclick=async()=>{ if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; } $('#installScrim').classList.remove('on'); };
}
window.addEventListener('appinstalled',()=>{ $('#installScrim').classList.remove('on'); });

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }
let toastT;
function toast(msg){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 140px);background:var(--raised);border:1px solid var(--accent);color:var(--ink);padding:10px 16px;border-radius:999px;z-index:65;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);transition:opacity .2s;max-width:90vw;text-align:center'; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity='1'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.opacity='0',1900); }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const ck=e.target.closest('[data-check]'); if(ck){ const[k,id]=ck.dataset.check.split(':');
    if(k==='task'){ const x=state.tasks.find(y=>y.id===id); if(x&&!x.done){x.done=true;touch(x);award('task');save();render();toast(t('toast.task_done',{xp:XP.task}));} } else { openLead(id); } return; }
  const oi=e.target.closest('[data-openitem]'); if(oi){ const[k,id]=oi.dataset.openitem.split(':'); if(k==='task') openTask(id); else openLead(id); return; }
  const td=e.target.closest('[data-tdone]'); if(td){ const x=state.tasks.find(y=>y.id===td.dataset.tdone); if(x){x.done=!x.done;touch(x);if(x.done)award('task');save();render();} return; }
  const te=e.target.closest('[data-tedit]'); if(te){ openTask(te.dataset.tedit); return; }
  const ce=e.target.closest('[data-cedit]'); if(ce){ openContact(ce.dataset.cedit); return; }
});
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
function go(v){ activeView=v; $$('.view').forEach(s=>s.classList.toggle('on',s.dataset.view===v)); $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.go===v)); }
$('#fab').onclick=()=>{ ({board:()=>openLead(),tasks:()=>openTask(),network:()=>openContact(),focus:()=>openTask(),guide:()=>openLead()})[activeView](); };
$('#menuBtn').onclick=openMenu; $('#syncBtn').onclick=openSync; $('#connDot').onclick=openSync;

// Update detection. Installed iOS PWAs resume rather than navigate, so the browser's
// passive SW update check rarely fires — we trigger it ourselves on load, whenever the
// app returns to the foreground (throttled), and on an explicit "Check for updates".
let swReg=null, _lastUpdCheck=0;
function showUpdateBanner(){ $('#updBanner').classList.add('on'); }
async function checkForUpdates(manual){
  if(!('serviceWorker' in navigator) || !swReg){ if(manual) toast(t('update.no_sw')); return; }
  if(manual) toast(t('update.checking'));
  try{ await swReg.update(); }catch(e){}
  if(swReg.waiting){ try{ swReg.waiting.postMessage('skip-waiting'); }catch(e){} showUpdateBanner(); if(manual) toast(t('update.found')); }
  else if(swReg.installing){ if(manual) toast(t('update.found')); }
  else if(manual){ toast(t('update.uptodate',{v:APP_VERSION})); }
}
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  let first=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(first) showUpdateBanner(); first=true; });
  navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener('statechange',()=>{ if(nw.state==='installed' && navigator.serviceWorker.controller) showUpdateBanner(); }); });
    reg.update().catch(()=>{});
  }).catch(()=>{});
  $('#updBtn').onclick=()=>location.reload();
  const recheck=()=>{ if(document.visibilityState==='visible' && Date.now()-_lastUpdCheck>20000){ _lastUpdCheck=Date.now(); checkForUpdates(false); } };
  document.addEventListener('visibilitychange',recheck);
  window.addEventListener('focus',recheck);
}

/* ---------- boot ---------- */
I.setLang(state.settings.lang||'en');
// device identity (device-local, persisted once)
state.settings.deviceId = state.settings.deviceId || ('pp-'+Math.random().toString(36).slice(2,7)+Math.random().toString(36).slice(2,7));
state.settings.deviceName = state.settings.deviceName || deviceLabelFromUA();
if(!Array.isArray(state.settings.knownDevices)) state.settings.knownDevices=[];
save();
go(window.matchMedia('(min-width:900px)').matches ? 'board' : 'focus');
render();
setTimeout(()=>showInstall(false), 900);
// auto-reconnect to remembered devices on open
if(state.settings.knownDevices.length) setTimeout(()=>startPeer(), 400);
window.PP={state:()=>state, t, reset:()=>{localStorage.removeItem(KEY);location.reload();}, showInstall:()=>showInstall(true), cleanup:cleanupDuplicates};
</script>
